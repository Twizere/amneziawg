stages:
  - build

variables:
  PKG_VERSION: "1.0.0"  # Update this version number for each release
  WEB_REPO_PATH: "/usr/local/www/awgrepo"  # Web server repository path

before_script:
  - echo "Setting up the build environment"

build_and_package:
  stage: build
  script:
    - echo "Installing dependencies"
    - echo "Building version ${PKG_VERSION}"
    - echo "Cleaning up previous stagedir and build artifacts"
    - rm -rf $CI_PROJECT_DIR/stagedir
    - rm -rf $CI_PROJECT_DIR/awgrepo
    - rm -f $CI_PROJECT_DIR/*.pkg
    - rm -f $CI_PROJECT_DIR/*.tar.gz
    - echo "Listing files in $CI_PROJECT_DIR before copying"
    - ls -la $CI_PROJECT_DIR
    - mkdir -p $CI_PROJECT_DIR/stagedir
    - echo "Listing files in $CI_PROJECT_DIR/stagedir after creation"
    - ls -la $CI_PROJECT_DIR/stagedir
    - echo "Checking if pkg-plist exists"
    - test -f $CI_PROJECT_DIR/pkg-plist && echo "pkg-plist file exists" || echo "pkg-plist file is missing"
    - echo "Checking if metadir exists"
    - test -d $CI_PROJECT_DIR/metadir && echo "metadir directory exists" || echo "metadir directory is missing"
    - echo "Checking if +MANIFEST file exists inside metadir"
    - test -f $CI_PROJECT_DIR/metadir/+MANIFEST && echo "+MANIFEST file exists in metadir" || echo "+MANIFEST file is missing in metadir"
    - echo "Copying files to stagedir"
    - cp -r $CI_PROJECT_DIR/files/. $CI_PROJECT_DIR/stagedir/
    - echo "Listing files in stagedir after copy"
    - ls -la $CI_PROJECT_DIR/stagedir
    - echo "Updating version in +MANIFEST to ${PKG_VERSION}"
    - sed -i '' "s/\"version\": \".*\"/\"version\": \"${PKG_VERSION}\"/" $CI_PROJECT_DIR/metadir/+MANIFEST
    - echo "Creating pfSense package"
    - pkg create -m metadir -r $CI_PROJECT_DIR/stagedir -p pkg-plist -o $CI_PROJECT_DIR
    - echo "Package creation completed"
    - echo "Detecting system architecture"
    - export ABI=$(pkg config abi)
    - echo "Detected ABI: ${ABI}"
    - echo "Setting up repository directory"
    - mkdir -p $CI_PROJECT_DIR/awgrepo/${ABI}
    - echo "Copying package to repository directory"
    - cp $CI_PROJECT_DIR/pfSense-pkg-Amneziawireguard-*.pkg $CI_PROJECT_DIR/awgrepo/${ABI}/
    - echo "Creating repository metadata"
    - pkg repo $CI_PROJECT_DIR/awgrepo/${ABI}
    - echo "Compressing repository with version ${PKG_VERSION}"
    - cd $CI_PROJECT_DIR && tar -czf awgrepo-${PKG_VERSION}-${ABI}.tar.gz awgrepo/${ABI}/
    - echo "Repository packaging completed"
    - echo "Deploying repository to web server directory"
    - mkdir -p ${WEB_REPO_PATH}
    - echo "Extracting repository to ${WEB_REPO_PATH}"
    - tar -xzf $CI_PROJECT_DIR/awgrepo-${PKG_VERSION}-${ABI}.tar.gz -C ${WEB_REPO_PATH} --strip-components=1
    - echo "Setting proper permissions"
    - chown -R www:www ${WEB_REPO_PATH}
    - chmod -R 755 ${WEB_REPO_PATH}
    - echo "Repository deployed successfully"
    - echo "Verifying deployment"
    - ls -la ${WEB_REPO_PATH}/${ABI}/
  artifacts:
    paths:
      - $CI_PROJECT_DIR/awgrepo-*.tar.gz
  tags:
    - freebsd-runner
